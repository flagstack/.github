name: Feature request
description: Suggest an improvement or new capability for Switch On Your Code.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Switch On Your Code. For substantial architectural or public API changes, please focus on the problem first so alternatives can be discussed before implementation begins.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour or capability you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include examples, diagrams, screenshots, compatibility considerations, or related projects where useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for a similar proposal.
          required: true
        - label: I have described the problem as well as the proposed solution.
          required: true
